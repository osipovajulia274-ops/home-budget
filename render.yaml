# Render Blueprint (check the syntax against https://render.com/docs/blueprint-spec before the first deploy)
services:
  - type: web
    name: home-budget
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: home-budget-db
          property: connectionString
      - key: APP_ENV
        value: prod
databases:
  - name: home-budget-db
    plan: free
