# Seed dictionary (D8): clean item names per subcategory, used (a) for subcategories absent in
# Open*Facts (services, cafés, transport...) and (b) as a fallback / supplement for the rest.
# Items are separated by " | ". Placeholders in {braces} are filled randomly (see `fills`).
# Brand names appear only as receipt text (real receipts contain them), never in the UI.
# This file is hand-written: dataset rows from it are marked source="seed".

fills:
  ml: ["200мл", "250 мл", "330мл", "500мл", "0,5л", "900мл", "1л", "1,5л", "2л"]
  g: ["50г", "100г", "150г", "200г", "250г", "300г", "400г", "450г", "500г", "900г", "1кг"]
  fat: ["1%", "1,5%", "2,5%", "3,2%", "3,5%", "5%", "9%", "15%", "20%"]
  n: ["2", "3", "4", "5", "6", "8", "10", "12", "20", "30"]
  liters: ["10", "15,3", "20", "25,4", "30", "35,2", "40", "45"]
  city: ["Москва", "Казань", "Самара", "Тверь", "Омск", "Пермь", "Томск", "Уфа"]
  month: ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"]
