# Parameters of the SYNTHETIC transaction generator (ml/scripts/05_generate_transactions.py).
# Everything produced from this file is synthetic: it is used to train and to check the forecaster,
# and for the demo data in the app. It is not a measurement of real households.
#
# NOTE: the `food.*` shares of every persona were multiplied by 1.45 after the first run (food was 26.5% of
# spending, Rosstat reference is ~one third); the realised share is 32.8%.
# Calibration target (guide 7.3): food ~ one third of consumer spending (Rosstat household budget
# survey 2019-2023, regional figures 31-34%). `tests/test_transactions.py` checks the realised share.

simulation:
  start: "2024-10-01"
  months: 24
  inflation_per_month: [0.004, 0.006]   # a user's monthly price growth is drawn from this range
  impulse_day_prob: 0.04                # share of days with extra discretionary purchases
  payday_boost: 1.35                    # discretionary purchase rate multiplier on the 3 days after payday
  taste_sigma: 0.25                     # per-user lognormal scatter of every subcategory's spending level
  big_expenses:                         # (subcategory, probability per month, amount range in roubles)
    - [home.appliances, 0.05, [8000, 60000]]
    - [health.doctors, 0.08, [2500, 15000]]
    - [transport.car_service, 0.06, [3000, 25000]]
    - [clothes_beauty.clothes, 0.10, [3000, 15000]]
    - [leisure.travel, 0.03, [15000, 90000]]

# Variable spending. per_week = average number of purchases per week for a user with freq_mult 1;
# dow = relative weight of Mon..Sun; sigma = lognormal sigma of a single purchase;
# season = key into `seasonality`; discretionary = reacts to payday and impulse days.
events:
  food.dairy:          {per_week: 2.0, dow: [1, 1, 1, 1, 1.2, 1.6, 1.4], sigma: 0.5, season: food}
  food.meat_fish:      {per_week: 1.5, dow: [1, 1, 1, 1, 1.2, 1.6, 1.3], sigma: 0.6, season: food}
